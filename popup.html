<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="icons/logo.png" alt="Tab Saver" height="24">
        <h1>Tab Saver</h1>
      </div>
      <!-- TIP JAR LINK - Change the href below to your Buy Me a Coffee URL -->
      <a href="https://google.com" target="_blank" class="tipjar-link" id="tipjarLink">Tip Jar</a>
    </header>

    <!-- Save Current Tabs Section -->
    <section class="save-section">
      <div class="input-group">
        <input type="text" id="folderName" placeholder="Name this session..." autocomplete="off">
        <button id="saveBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H16L21 8V19C21 20.1046 20.1046 21 19 21Z"/>
            <path d="M17 21V13H7V21"/>
            <path d="M7 3V8H15"/>
          </svg>
          Save Tabs
        </button>
      </div>
      <p class="tab-count" id="tabCount">0 tabs open</p>
    </section>

    <!-- Folders List -->
    <section class="folders-section">
      <h2 class="section-title">Saved Sessions</h2>
      <div id="foldersList" class="folders-list">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
            <path d="M3 7V17C3 18.1046 3.89543 19 5 19H19C20.1046 19 21 18.1046 21 17V9C21 7.89543 20.1046 7 19 7H13L11 5H5C3.89543 5 3 5.89543 3 7Z"/>
          </svg>
          <p>No saved sessions yet</p>
        </div>
      </div>
    </section>

    <!-- Theme Toggle -->
    <section class="theme-toggle-section">
      <div class="theme-toggle">
        <span class="theme-toggle-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          Dark Mode
        </span>
        <div class="toggle-switch" id="themeToggle"></div>
      </div>
    </section>
  </div>

  <!-- Folder Detail View (Hidden by default) -->
  <div class="container detail-view" id="detailView" style="display: none;">
    <header class="header">
      <button id="backBtn" class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19L5 12L12 5"/>
        </svg>
      </button>
      <input type="text" id="detailTitle" class="detail-title" value="Session Name" readonly>
      <button id="renameBtn" class="btn-icon" title="Rename session">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4C2.89543 4 2 4.89543 2 6V20C2 21.1046 2.89543 22 4 22H18C19.1046 22 20 21.1046 20 20V13"/>
          <path d="M18.5 2.5C19.3284 1.67157 20.6716 1.67157 21.5 2.5C22.3284 3.32843 22.3284 4.67157 21.5 5.5L12 15L8 16L9 12L18.5 2.5Z"/>
        </svg>
      </button>
      <button id="deleteFolder" class="btn-icon btn-danger" title="Delete session">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6H21M19 6V20C19 21.1046 18.1046 22 17 22H7C5.89543 22 5 21.1046 5 20V6M8 6V4C8 2.89543 8.89543 2 10 2H14C15.1046 2 16 2.89543 16 4V6"/>
        </svg>
      </button>
    </header>

    <button id="openAllBtn" class="btn btn-primary btn-full">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13V19C18 20.1046 17.1046 21 16 21H5C3.89543 21 3 20.1046 3 19V8C3 6.89543 3.89543 6 5 6H11"/>
        <path d="M15 3H21V9"/>
        <path d="M10 14L21 3"/>
      </svg>
      Open All in New Window
    </button>

    <div class="tabs-list" id="tabsList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
